[phases.setup]
nixPkgs = [
  "chromium",
  "nss",
  "nspr",
  "atk",
  "cups",
  "dbus",
  "libdrm",
  "libxkbcommon",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
  "mesa",
  "expat",
  "libGL",
  "alsa-lib",
  "pango",
  "cairo",
  "glib",
]

[phases.install]
cmds = ["npm ci --omit=dev"]

[start]
cmd = "node server/server.js"
